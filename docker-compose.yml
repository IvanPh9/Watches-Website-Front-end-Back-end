name: watches-project

services:
  db:
    image: postgres:15-alpine
    container_name: watches_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: watches_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Цей рядок автоматично завантажить наші таблиці при створенні бази
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata: